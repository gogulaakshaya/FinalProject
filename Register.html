<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - KL E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffeaf2;
        }

        /* Header */
        .header {
            background: #fff0f5;
            border-top: 1px solid #f080a0;
            height: 165px;
            display: flex;
            align-items: center;
            padding-left: 350px;
        }


        .header h1 {
            color: #142238;
            font: size 45px;
            margin: 0;
            font-weight:bolder;
            text-align: center;
        }

        /* Register Box */
        .register {
            background: white;
            width: 380px;
            margin: 35px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #e8b8c8;
        }

        .register h2 {
            text-align: center;
            color: #d6336c;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #f0b6c8;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #e75480;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #e75480;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #d6336c;
        }

        /* OTP */
        #otpBox {
            display: none;
            margin-top: 10px;
        }

        /* Success Message */
        #success {
            display: none;
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #d6336c;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">

        <h1>🛒KL E-Commerce Store</h1>

    </div>


    <!-- Register Form -->
    <div class="register">

        <h2>Create Account</h2>

        <input type="text" id="name"
            placeholder="Full Name">

        <input type="email" id="email"
            placeholder="Email">

        <input type="tel" id="phone"
            placeholder="WhatsApp Phone Number">

        <input type="password" id="password"
            placeholder="Password">

        <input type="password" id="confirmPassword"
            placeholder="Confirm Password">


        <!-- Send OTP -->
        <button onclick="sendOTP()">
            Send OTP on WhatsApp
        </button>


        <!-- OTP Box -->
        <div id="otpBox">

            <input type="text" id="otp"
                placeholder="Enter OTP">

            <button onclick="verifyOTP()">
                Verify OTP
            </button>

        </div>
        
        <!-- Success -->
        <div id="success">
            Registration Successful!
        </div>


        <div class="login">
            Already have an account?
            <a href="Login.html">Login</a>
        </div>

    </div>


    <script>

        function sendOTP() {

            let phone = document.getElementById("phone").value;

            if (phone == "") {
                alert("Please enter your phone number");
                return;
            }

            document.getElementById("otpBox").style.display = "block";
        }


        function verifyOTP() {

            let otp = document.getElementById("otp").value;

            if (otp == "") {
                alert("Please enter OTP");
                return;
            }

            document.getElementById("success").style.display = "block";
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - KL E-Commerce Store</title>

    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <!-- Main Login Container -->
    <div class="login-container">

        <!-- Login Section -->
        <div id="login-section">

            <div class="logo">
                🛒
            </div>

            <h1>KL E-Commerce Store</h1>
            <h2>Login</h2>

            <p class="welcome">Welcome back! Please login to your account.</p>

            <form id="loginForm">

                <!-- Email -->
                <label for="email">Email</label>

                <input 
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- Password -->
                <label for="password">Password</label>

                <div class="password-box">

                    <input 
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button 
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        👁
                    </button>
                    <p id="loginMessage"></p>

                </div>

                <!-- Forgot Password -->
                <div class="forgot">

                    <a href="#forgot-password" onclick="showForgotPassword()">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <!-- Register -->
            <p class="register-text">
                Don't have an account?
                <a href="Register.html">Register</a>
            </p>

            <!-- Back to Home -->
            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </div>


        <!-- Forgot Password Section -->
        <div id="forgot-password">

            <div class="logo">
                🔐
            </div>

            <h2>Reset Password</h2>

            <p class="welcome">
                Enter your email and create a new password.
            </p>

            <form id="resetForm">

                <!-- Email -->
                <label for="resetEmail">Email</label>

                <input 
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your registered email"
                    required
                >

                <!-- New Password -->
                <label for="newPassword">New Password</label>

                <input 
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password</label>

                <input 
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <!-- Reset Button -->
                <button type="submit" class="login-btn">
                    Reset Password
                </button>

            </form>

            <!-- Message -->
            <p id="resetMessage"></p>

            <!-- Back to Login -->
            <a href="#login" class="back-login" onclick="showLogin()">
                ← Back to Login
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
